name: Actualizar reservas y puntos móviles de Madrid

on:
  schedule:
    - cron: "30 7,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Madrid blood reserves and mobile points
        run: python scripts/fetch_madrid_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/madrid-status.json
          if git diff --staged --quiet; then
            echo "No changes in data/madrid-status.json"
          else
            git commit -m "chore: update Madrid blood reserves and mobile points"
            git push
          fi
